  /api/votesByElection:
    get:
      tags:
        - Election Info
      summary: Get candidate vote counts with location details
      description: Retrieve detailed voting results with structured location information for all election types
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: electionId
          required: true
          schema:
            type: string
          description: ID of the election
          example: "GUP_2025_THIMPHU"
        - in: query
          name: electionType
          required: false
          schema:
            type: string
            enum:
              [
                NATIONAL_ASSEMBLY,
                NATIONAL_COUNCIL,
                GUP,
                MANGMI,
                TSHOGPA,
                THROMPON,
                THROMPON_TSHOGPA,
              ]
          description: Type of election (recommended for structured location details, case-insensitive)
          example: "GUP"
      responses:
        "200":
          description: Vote counts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        candidate:
                          type: string
                          example: "Karma Wangchuk"
                        location:
                          type: string
                          example: "Paro/Lungnyi"
                        locationDetails:
                          type: object
                          description: Structured location information
                          example:
                            dzongkhag: "Paro"
                            gewog: "Lungnyi"
                        votes:
                          type: string
                          example: "450"
                  totalVotes:
                    type: string
                    example: "830"
                  totalMale:
                    type: string
                    example: "420"
                  totalFemale:
                    type: string
                    example: "410"
        "400":
          description: Bad request
        "404":
          description: Election not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - admin only

  /api/checkVoted:
    get:
      tags:
        - Voting
      summary: Check if a user has voted
      description: Check if a specific user has voted in an election
      security:
        - bearerAuth: []
      parameters:
        - name: electionId
          in: query
          required: true
          schema:
            type: string
          description: ID of the election
          example: "GUP_2025_THIMPHU"
        - name: uid
          in: query
          required: true
          schema:
            type: string
          description: Unique identifier of the voter (CID)
          example: "11234567890123"
      responses:
        "200":
          description: Vote status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  voted:
                    type: boolean
                    example: true
        "400":
          description: Bad request - missing parameters
        "403":
          description: Forbidden - admin only
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/geographicalResults:
    get:
      tags:
        - Election Info
      summary: Get geographical area results
      description: Get vote aggregation by geographical area (demkhong/gewog/chewog/throm) with gender breakdown for all election types
      security:
        - bearerAuth: []
      parameters:
        - name: electionId
          in: query
          required: true
          schema:
            type: string
          description: ID of the election
          example: "TSHOGPA_2025"
        - name: electionType
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                NATIONAL_ASSEMBLY,
                NATIONAL_COUNCIL,
                GUP,
                MANGMI,
                TSHOGPA,
                THROMPON,
                THROMPON_TSHOGPA,
              ]
          description: Type of election (case-insensitive, accepts variations like 'nc', 'thrompoen')
          example: "TSHOGPA"
      responses:
        "200":
          description: Geographical results retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        location:
                          type: string
                          example: "Paro/Lungnyi/Tsento"
                        locationDetails:
                          type: object
                          example:
                            dzongkhag: "Paro"
                            gewog: "Lungnyi"
                            chewog: "Tsento"
                        totalVotes:
                          type: string
                          example: "223"
                        maleVotes:
                          type: string
                          example: "110"
                        femaleVotes:
                          type: string
                          example: "113"
                  electionType:
                    type: string
                    example: "TSHOGPA"
                  locationLabel:
                    type: string
                    example: "Chewog"
        "400":
          description: Bad request
        "404":
          description: Election not found
        "403":
          description: Forbidden - admin only

  /api/demkhongResults:
    get:
      tags:
        - Election Info
      summary: Get demkhong results (Legacy - redirects to geographicalResults)
      description: Legacy endpoint for backward compatibility - retrieves geographical results
      security:
        - bearerAuth: []
      parameters:
        - name: electionId
          in: query
          required: true
          schema:
            type: string
          description: ID of the election
          example: "NA_2025"
        - name: electionType
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                NATIONAL_ASSEMBLY,
                NATIONAL_COUNCIL,
                GUP,
                MANGMI,
                TSHOGPA,
                THROMPON,
                THROMPON_TSHOGPA,
              ]
          description: Type of election (case-insensitive)
      responses:
        "200":
          description: Results retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
        "404":
          description: Election not found

  /api/public-result/{electionId}:
    get:
      tags:
        - Public
      summary: Get public election results
      description: Get election results (only available after election has ended)
      security:
        - bearerAuth: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
          description: ID of the election
          example: "NA_2025"
        - name: electionType
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                NATIONAL_ASSEMBLY,
                NATIONAL_COUNCIL,
                GUP,
                MANGMI,
                TSHOGPA,
                THROMPON,
                THROMPON_TSHOGPA,
              ]
          description: Type of election for structured location details (case-insensitive)
      responses:
        "200":
          description: Public results retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        candidate:
                          type: string
                        location:
                          type: string
                        locationDetails:
                          type: object
                        votes:
                          type: string
                  totalVotes:
                    type: string
                  totalMale:
                    type: string
                  totalFemale:
                    type: string
        "403":
          description: Election not yet ended
        "404":
          description: Election not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
