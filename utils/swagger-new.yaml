  /api/votesByElection:
    get:
      tags:
        - Election Info
      summary: Get candidate vote counts with polling station breakdown and location filtering
      description: |
        Retrieve detailed voting results with polling station breakdown and structured location information. 
        
        **Location Filtering (Hierarchical):**
        
        - **NA (National Assembly):** Filter by `dzongkhag` and/or `demkhong`
        - **NC (National Council):** Filter by `dzongkhag` only
        - **GUP/MANGMI:** Filter by `dzongkhag` and/or `gewog`
        - **C_TSHOGPA (Chiwog Tshogpa):** Filter by `dzongkhag`, `gewog`, and/or `chiwog`
        - **THROMPOEN (Thrompon):** Filter by `dzongkhag` and/or `thromde`
        - **T_TSHOGPA (Thrompon Tshogpa):** Filter by `dzongkhag` and/or `thromde`
        
        **Examples:**
        - Get all C_TSHOGPA from Tsirang: `?electionType=C_TSHOGPA&dzongkhag=Tsirang`
        - Get C_TSHOGPA from specific Gewog: `?electionType=C_TSHOGPA&dzongkhag=Tsirang&gewog=Phuntenchu`
        - Get C_TSHOGPA from specific Chiwog: `?electionType=C_TSHOGPA&dzongkhag=Tsirang&gewog=Phuntenchu&chiwog=Trashicholing`
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: electionId
          required: true
          schema:
            type: string
          description: ID of the election
          example: "C_TSHOGPA_2025"
        - in: query
          name: electionType
          required: false
          schema:
            type: string
            enum:
              [
                NA,
                NC,
                GUP,
                MANGMI,
                C_TSHOGPA,
                THROMPOEN,
                T_TSHOGPA,
              ]
          description: Type of election (required for location filtering)
          example: "C_TSHOGPA"
        - in: query
          name: dzongkhag
          required: false
          schema:
            type: string
          description: "**[NA, NC, GUP, MANGMI, C_TSHOGPA, T_TSHOGPA]** Filter by Dzongkhag"
          example: "Tsirang"
        - in: query
          name: gewog
          required: false
          schema:
            type: string
          description: "**[GUP, MANGMI, C_TSHOGPA]** Filter by Gewog (use with dzongkhag)"
          example: "Phuntenchu"
        - in: query
          name: chiwog
          required: false
          schema:
            type: string
          description: "**[C_TSHOGPA only]** Filter by Chiwog (use with dzongkhag + gewog)"
          example: "Trashicholing"
        - in: query
          name: demkhong
          required: false
          schema:
            type: string
          description: "**[NA only]** Filter by Demkhong (use with dzongkhag)"
          example: "Thimphu"
        - in: query
          name: thromde
          required: false
          schema:
            type: string
          description: "**[THROMPOEN, T_TSHOGPA]** Filter by Thromde (use with dzongkhag)"
          example: "Thimphu Thromde"
      responses:
        "200":
          description: Vote counts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        candidate:
                          type: string
                          example: "Karma Wangchuk"
                        location:
                          type: string
                          example: "Paro/Lungnyi"
                        locationDetails:
                          type: object
                          description: Structured location information
                          example:
                            dzongkhag: "Paro"
                            gewog: "Lungnyi"
                        votes:
                          type: object
                          description: Vote breakdown by polling station
                          example:
                            PS_Paro_01: "120"
                            PS_Paro_02: "185"
                            PS_Paro_03: "145"
                        totalVotes:
                          type: string
                          example: "450"
                  totalVotes:
                    type: string
                    example: "830"
                  totalMale:
                    type: string
                    example: "420"
                  totalFemale:
                    type: string
                    example: "410"
        "400":
          description: Bad request
        "404":
          description: Election not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - admin only

  /api/checkVoted:
    get:
      tags:
        - Voting
      summary: Check if a user has voted
      description: Check if a specific user has voted in an election
      security:
        - bearerAuth: []
      parameters:
        - name: electionId
          in: query
          required: true
          schema:
            type: string
          description: ID of the election
          example: "GUP_2025_THIMPHU"
        - name: uid
          in: query
          required: true
          schema:
            type: string
          description: Unique identifier of the voter (CID)
          example: "11234567890123"
      responses:
        "200":
          description: Vote status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  voted:
                    type: boolean
                    example: true
        "400":
          description: Bad request - missing parameters
        "403":
          description: Forbidden - admin only
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/geographicalResults:
    get:
      tags:
        - Election Info
      summary: Get geographical area results
      description: Get vote aggregation by geographical area (demkhong/gewog/chiwog/thromde) with gender breakdown for all election types
      security:
        - bearerAuth: []
      parameters:
        - name: electionId
          in: query
          required: true
          schema:
            type: string
          description: ID of the election
          example: "C_TSHOGPA_2025"
        - name: electionType
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                NA,
                NC,
                GUP,
                MANGMI,
                C_TSHOGPA,
                THROMPOEN,
                T_TSHOGPA,
              ]
          description: Type of election (case-insensitive)
          example: "C_TSHOGPA"
      responses:
        "200":
          description: Geographical results retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        location:
                          type: string
                          example: "Paro/Lungnyi/Tsento"
                        locationDetails:
                          type: object
                          example:
                            dzongkhag: "Paro"
                            gewog: "Lungnyi"
                            chiwog: "Tsento"
                        totalVotes:
                          type: string
                          example: "223"
                        maleVotes:
                          type: string
                          example: "110"
                        femaleVotes:
                          type: string
                          example: "113"
                  electionType:
                    type: string
                    example: "C_TSHOGPA"
                  locationLabel:
                    type: string
                    example: "Chiwog"
        "400":
          description: Bad request
        "404":
          description: Election not found
        "403":
          description: Forbidden - admin only

  /api/demkhongResults:
    get:
      tags:
        - Election Info
      summary: Get demkhong results (Legacy - redirects to geographicalResults)
      description: Legacy endpoint for backward compatibility - retrieves geographical results
      security:
        - bearerAuth: []
      parameters:
        - name: electionId
          in: query
          required: true
          schema:
            type: string
          description: ID of the election
          example: "NA_2025"
        - name: electionType
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                NA,
                NC,
                GUP,
                MANGMI,
                C_TSHOGPA,
                THROMPOEN,
                T_TSHOGPA,
              ]
          description: Type of election (case-insensitive)
      responses:
        "200":
          description: Results retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
        "404":
          description: Election not found

  /api/public-result/{electionId}:
    get:
      tags:
        - Public
      summary: Get public election results
      description: Get election results (only available after election has ended)
      security:
        - bearerAuth: []
      parameters:
        - name: electionId
          in: path
          required: true
          schema:
            type: string
          description: ID of the election
          example: "NA_2025"
        - name: electionType
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                NA,
                NC,
                GUP,
                MANGMI,
                C_TSHOGPA,
                THROMPOEN,
                T_TSHOGPA,
              ]
          description: Type of election for structured location details (case-insensitive)
      responses:
        "200":
          description: Public results retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        candidate:
                          type: string
                        location:
                          type: string
                        locationDetails:
                          type: object
                        votes:
                          type: object
                          description: Vote breakdown by polling station
                        totalVotes:
                          type: string
                  totalVotes:
                    type: string
                    description: Total votes (filtered if location params provided)
                  totalMale:
                    type: string
                  totalFemale:
                    type: string
                  filteredBy:
                    type: string
                    nullable: true
                    description: Location string used for filtering (null if no filter applied)
                    example: "Tsirang/Phuntenchu"
        "403":
          description: Election not yet ended
        "404":
          description: Election not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
